schema_version: '1.0'
alias: gpt-5.4
provider: openai_responses
model_id: gpt-5.4
enabled: true
capabilities:
  supported:
  - text_input
  - image_input
  - tool_calling
  - structured_output
  - reasoning
  metadata:
    protocol: responses
generation:
  max_output_tokens: 8192
  reasoning_effort: high
api:
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  timeout_seconds: 180
  max_retries: 3
metadata:
  purpose: primary spatial reasoning and knowledge construction
  v2_reasoning_modes:
    instruct:
      reasoning_effort: none
    thinking:
      reasoning_effort: medium
  v2_reasoning_mode_validation: configured_unverified_endpoint
